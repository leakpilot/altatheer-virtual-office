
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALTATHEER Virtual Office</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f5f5f5;font-family:Arial,sans-serif}
header{background:#181818;padding:24px;border-bottom:2px solid #c6a04a}
h1{color:#d6b45c;margin:0}
header p{color:#aaa}
main{padding:18px;max-width:850px;margin:auto}
select{background:#252525;color:white;padding:10px;border:1px solid #b99a4a;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
.card{background:#202020;border:1px solid #49402b;border-radius:12px;padding:20px;min-height:105px}
.card h3{color:#d6b45c;margin:0 0 10px}
.card p{color:#bbb;font-size:13px;margin:0}
footer{text-align:center;color:#888;padding:25px}
@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>ALTATHEER</h1>
<p>REAL ESTATE VIRTUAL OFFICE</p>
<select id="language" onchange="changeLanguage()">
<option value="ar">العربية</option>
<option value="en">English</option>
</select>
</header>
<main>
<h2 id="welcome">مرحباً بك في المكتب الافتراضي</h2>
<p id="subtitle">إدارة أعمال التأثير للعقارات</p>
<div class="grid" id="menu"></div>
</main>
<footer>ALTATHEER REAL ESTATE LLC<br>+971 55 601 2040</footer>
<script>
const translations={
ar:[
["المشترون والمستثمرون","إدارة العملاء"],
["العقارات والأصول","الأراضي والأبراج والمباني"],
["طلبات الشراء","طلبات العملاء"],
["مطابقة الطلبات","مطابقة الطلبات بالعروض"],
["الصفقات والعمولات","متابعة الصفقات"],
["التقارير اليومية","متابعة الأداء"]
],
en:[
["Buyers & Investors","Manage clients"],
["Properties & Assets","Land, towers and buildings"],
["Buyer Requests","Client requirements"],
["Matching Engine","Match requests with offers"],
["Deals & Commissions","Track transactions"],
["Daily Reports","Business performance"]
]
};
function changeLanguage(){
const lang=document.getElementById("language").value;
document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.getElementById("welcome").textContent=lang==="ar"?"مرحباً بك في المكتب الافتراضي":"Welcome to Virtual Office";
document.getElementById("subtitle").textContent=lang==="ar"?"إدارة أعمال التأثير للعقارات":"ALTATHEER REAL ESTATE Management";
document.getElementById("menu").innerHTML=translations[lang].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("");
}
changeLanguage();
</script>
</body>
</html>
